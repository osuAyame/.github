<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Live leaderboards" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1b3f"/><stop offset="1" stop-color="#171020"/></linearGradient>
  <radialGradient id="tg" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#cda8ff" stop-opacity=".24"/><stop offset="1" stop-color="#cda8ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="lp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cda8ff"/><stop offset="1" stop-color="#fbc2eb"/></linearGradient>
  <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbc2eb"/><stop offset="1" stop-color="#cda8ff"/></linearGradient><linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cda8ff"/><stop offset="1" stop-color="#8f6bd1"/></linearGradient>
</defs>
<style>.fb{transform-box:fill-box;transform-origin:center}
.lb{transform-box:fill-box;transform-origin:50% 100%;animation:lb 3.6s cubic-bezier(.37,0,.63,1) infinite}
@keyframes lb{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
.crown{animation:crown 3.6s cubic-bezier(.37,0,.63,1) infinite}
@keyframes crown{0%,100%{transform:translateY(6px)}50%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="78" height="78" rx="22" fill="url(#tile)" stroke="#cda8ff" stroke-opacity=".28" stroke-width="1.5"/>
<rect x="1" y="1" width="78" height="78" rx="22" fill="url(#tg)"/>

<line x1="12" y1="64" x2="68" y2="64" stroke="#cda8ff" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
<rect class="lb" x="15" y="40" width="14" height="22" rx="4" fill="url(#b2)" style="animation-delay:-1.2s"/>
<rect class="lb" x="33" y="28" width="14" height="34" rx="4" fill="url(#b1)"/>
<rect class="lb" x="51" y="47" width="14" height="15" rx="4" fill="url(#b2)" style="animation-delay:-2.4s"/>
