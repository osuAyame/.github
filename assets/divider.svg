<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
    <stop offset="0" stop-color="#cda8ff" stop-opacity="0"/><stop offset=".3" stop-color="#cda8ff"/><stop offset=".5" stop-color="#fbc2eb"/><stop offset=".7" stop-color="#cda8ff"/><stop offset="1" stop-color="#cda8ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#fbc2eb" stop-opacity=".55"/><stop offset="1" stop-color="#fbc2eb" stop-opacity="0"/></radialGradient>
</defs>
<style>
.dia{transform-box:fill-box;transform-origin:center;animation:dia 3.6s cubic-bezier(.37,0,.63,1) infinite}
@keyframes dia{0%,100%{transform:rotate(45deg) scale(.85)}50%{transform:rotate(225deg) scale(1.15)}}
.trav{animation:trav 6s cubic-bezier(.37,0,.63,1) infinite}
@keyframes trav{0%{transform:translateX(0);opacity:0}8%{opacity:1}62%{opacity:1}70%{transform:translateX(760px);opacity:0}100%{transform:translateX(760px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M20,12 H780" stroke="url(#ln)" stroke-width="2" stroke-linecap="round" fill="none"/>
<rect class="dia" x="396" y="8" width="8" height="8" rx="1.5" fill="#fbc2eb" transform="rotate(45 400 12)"/>
<g class="trav" style="opacity:0"><g transform="translate(20 12)"><circle r="10" fill="url(#gl)"/><circle r="2.2" fill="#fff"/></g></g>
</svg>
