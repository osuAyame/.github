<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="All modes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1b3f"/><stop offset="1" stop-color="#171020"/></linearGradient>
  <radialGradient id="tg" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#cda8ff" stop-opacity=".24"/><stop offset="1" stop-color="#cda8ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="lp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cda8ff"/><stop offset="1" stop-color="#fbc2eb"/></linearGradient>
  
</defs>
<style>.fb{transform-box:fill-box;transform-origin:center}
.pop{animation:pop 3.2s cubic-bezier(.37,0,.63,1) infinite}
@keyframes pop{0%{opacity:.45;transform:scale(1)}10%{opacity:1;transform:scale(1.18)}28%{opacity:.9;transform:scale(1)}100%{opacity:.45;transform:scale(1)}}
.appr{animation:appr 3.2s ease-out infinite}
@keyframes appr{0%{transform:scale(1.55);opacity:0}8%{opacity:.9}22%,100%{transform:scale(1);opacity:0}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 1.6s cubic-bezier(.37,0,.63,1) infinite}
@keyframes bar{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="78" height="78" rx="22" fill="url(#tile)" stroke="#cda8ff" stroke-opacity=".28" stroke-width="1.5"/>
<rect x="1" y="1" width="78" height="78" rx="22" fill="url(#tg)"/>

<path d="M40,14 V66 M14,40 H66" stroke="#cda8ff" stroke-opacity=".12" stroke-width="1.5" stroke-linecap="round"/>
<g class="pop fb">
  <circle cx="26" cy="26" r="8" fill="none" stroke="url(#lp)" stroke-width="2.6"/>
  <circle cx="26" cy="26" r="2.6" fill="#fbc2eb"/>
  <circle class="appr fb" cx="26" cy="26" r="11" fill="none" stroke="#fbc2eb" stroke-width="1.5"/>
</g>
<g class="pop fb" style="animation-delay:.8s">
  <circle cx="54" cy="26" r="9.6" fill="none" stroke="#cda8ff" stroke-width="1.8" stroke-opacity=".7"/>
  <circle cx="54" cy="26" r="6.6" fill="url(#lp)"/>
</g>
<g class="pop fb" style="animation-delay:1.6s">
  <path d="M26,44 C26,44 18.5,51.5 18.5,57 A7.5,7.5 0 0 0 33.5,57 C33.5,51.5 26,44 26,44Z" fill="url(#lp)"/>
  <circle cx="23.2" cy="55.6" r="1.8" fill="#fff" fill-opacity=".6"/>
</g>
<g class="pop fb" style="animation-delay:2.4s">
  <rect class="bar" x="45.4" y="48" width="4.6" height="14" rx="2.3" fill="url(#lp)"/>
  <rect class="bar" x="51.7" y="42" width="4.6" height="20" rx="2.3" fill="url(#lp)" style="animation-delay:-.4s"/>
  <rect class="bar" x="58" y="51" width="4.6" height="11" rx="2.3" fill="url(#lp)" style="animation-delay:-.8s"/>
</g>
</svg>
