<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" role="img" aria-labelledby="lineTitle">
  <title id="lineTitle">AYAME animated divider line</title>
  <metadata>
    Redesigned for the AYAME osu! private server, based on the
    animated-line concept by OstinUA / readme-SVG
    (https://github.com/readme-SVG/animated-line)
  </metadata>

  <defs>
    <!-- shimmer riding the wave: one tile = exactly one travel distance (600px),
         spreadMethod="repeat" makes the pattern periodic, so the 12s translate
         loop from 0 to -600 is pixel-identical at the seam.
         Same stop profile as banner/footer -> identical shimmer rhythm. -->
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#DCB9D7" stop-opacity="0.18"/>
      <stop offset="0.10" stop-color="#DCB9D7" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#DCB9D7" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#DCB9D7" stop-opacity="0.50"/>
      <stop offset="0.62" stop-color="#DCB9D7" stop-opacity="0.25"/>
      <stop offset="0.82" stop-color="#DCB9D7" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#DCB9D7" stop-opacity="0.18"/>
    </linearGradient>

    <!-- static edge fade so the line melts away at the left/right borders -->
    <linearGradient id="fadeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0"    stop-color="#000000"/>
      <stop offset="0.07" stop-color="#ffffff"/>
      <stop offset="0.93" stop-color="#ffffff"/>
      <stop offset="1"    stop-color="#000000"/>
    </linearGradient>
    <mask id="edgeFade">
      <rect width="900" height="14" fill="url(#fadeGrad)"/>
    </mask>
  </defs>

  <g mask="url(#edgeFade)" fill="none" stroke-linecap="round">
    <!-- slower echo wave -->
    <path d="M 0 7 Q 75 13 150 7 Q 225 2 300 7 Q 375 14 450 7 Q 525 3 600 7 Q 675 13 750 7 Q 825 2 900 7 Q 975 14 1050 7 Q 1125 3 1200 7 Q 1275 13 1350 7 Q 1425 2 1500 7 Q 1575 14 1650 7 Q 1725 3 1800 7 Q 1875 13 1950 7 Q 2025 2 2100 7" stroke="#DCB9D7" stroke-width="1.25" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <!-- navy strand: counter-phase to the pink core, locked to the same speed -->
    <path d="M 0 7 Q 75 -1 150 7 Q 225 13 300 7 Q 375 -2 450 7 Q 525 12 600 7 Q 675 -1 750 7 Q 825 13 900 7 Q 975 -2 1050 7 Q 1125 12 1200 7 Q 1275 -1 1350 7 Q 1425 13 1500 7" stroke="#1a1a2e" stroke-width="3" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <!-- glow layer, gently pulsing -->
    <path d="M 0 7 Q 75 16 150 7 Q 225 0 300 7 Q 375 18 450 7 Q 525 2 600 7 Q 675 16 750 7 Q 825 0 900 7 Q 975 18 1050 7 Q 1125 2 1200 7 Q 1275 16 1350 7 Q 1425 0 1500 7" stroke="url(#lineGrad)" stroke-width="5" stroke-opacity="0.3">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.22;0.5;0.22" keyTimes="0;0.5;1" dur="6s" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" repeatCount="indefinite"/>
    </path>
    <!-- core line -->
    <path d="M 0 7 Q 75 16 150 7 Q 225 0 300 7 Q 375 18 450 7 Q 525 2 600 7 Q 675 16 750 7 Q 825 0 900 7 Q 975 18 1050 7 Q 1125 2 1200 7 Q 1275 16 1350 7 Q 1425 0 1500 7" stroke="url(#lineGrad)" stroke-width="2.25">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
