<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#DCB9D7"/>
    </linearGradient>
    
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCB9D7" stop-opacity="0"/>
      <stop offset="15%" stop-color="#DCB9D7" stop-opacity="1"/>
      <stop offset="85%" stop-color="#DCB9D7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#DCB9D7" stop-opacity="0"/>
    </linearGradient>

    <!-- This mask creates the wavy bottom edge -->
    <mask id="waveMask">
      <!-- Fill the whole area white (visible) -->
      <rect width="2400" height="120" fill="white" />
      <!-- Draw a black wavy shape over the bottom to make it transparent -->
      <path d="M 0 110 Q 150 130 300 110 T 600 110 T 900 110 T 1200 110 T 1500 110 T 1800 110 T 2100 110 T 2400 110 L 2400 150 L 0 150 Z" fill="black">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="8s" repeatCount="indefinite" />
      </path>
    </mask>
  </defs>
  
  <!-- The background gradient is masked to have a wavy bottom -->
  <rect width="1200" height="120" fill="url(#bg)" mask="url(#waveMask)" />

  <!-- Glowing wavy line tracing the edge of the banner -->
  <g>
    <!-- Glow layer -->
    <path d="M 0 110 Q 150 130 300 110 T 600 110 T 900 110 T 1200 110 T 1500 110 T 1800 110 T 2100 110 T 2400 110" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-opacity="0.3">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="8s" repeatCount="indefinite" />
    </path>
    <!-- Core line -->
    <path d="M 0 110 Q 150 130 300 110 T 600 110 T 900 110 T 1200 110 T 1500 110 T 1800 110 T 2100 110 T 2400 110" fill="none" stroke="url(#waveGrad)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Text moved up slightly to accommodate the wave -->
  <text x="600" y="55" text-anchor="middle" font-family="Comfortaa, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="6">AYAME</text>
  <text x="600" y="82" text-anchor="middle" font-family="Comfortaa, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#f0e6ef" letter-spacing="4">OSU! PRIVATE SERVER</text>
</svg>